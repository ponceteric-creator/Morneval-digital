name: External Relations A/B simulation

on:
  push:
    paths:
      - '.github/workflows/balance-external-relations.yml'
      - 'js/v128-external-relations-engine.js'
      - 'js/v129-terrain-actions-engine.js'
      - 'js/v130-elven-alliance-engine.js'
      - 'js/v131-food-production-cleanup-engine.js'
      - 'scripts/external-relations-loader.mjs'
      - 'scripts/elven-alliance-sim-loader.mjs'
      - 'scripts/elven-strategy-ai-loader.mjs'
      - 'scripts/elven-quest-autocomplete-loader.mjs'
      - 'scripts/fortification-sim-loader.mjs'
      - 'scripts/stake-ai-diagnostic-loader.mjs'
      - 'scripts/current-food-production-cleanup-loader.mjs'
      - 'scripts/run-external-relations-batch.mjs'
      - 'scripts/run-production-stake-diagnostic.mjs'
      - 'scripts/test-elven-alliance-v130.mjs'
      - 'scripts/test-no-food-production-stakes.mjs'
      - 'rules/Appendix_N_External_Relations_v01119_Simulation.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable ESM
        run: echo '{"type":"module"}' > package.json
      - name: Elven alliance deterministic smoke test
        run: node --loader ./scripts/development-cost-loader.mjs --loader ./scripts/external-relations-loader.mjs --loader ./scripts/elven-alliance-sim-loader.mjs --loader ./scripts/elven-quest-autocomplete-loader.mjs --loader ./scripts/fortification-sim-loader.mjs ./scripts/test-elven-alliance-v130.mjs
      - name: No Food Production Sector regression test
        run: node --loader ./scripts/development-cost-loader.mjs --loader ./scripts/external-relations-loader.mjs --loader ./scripts/elven-alliance-sim-loader.mjs --loader ./scripts/elven-strategy-ai-loader.mjs --loader ./scripts/elven-quest-autocomplete-loader.mjs --loader ./scripts/fortification-sim-loader.mjs ./scripts/test-no-food-production-stakes.mjs
      - name: Baseline without activated diplomacy
        env:
          COST_MODE: proposed
          MERCHANT_AI: wealth
          EXTERNAL_RELATIONS: off
        run: node --loader ./scripts/development-cost-loader.mjs --loader ./scripts/external-relations-loader.mjs --loader ./scripts/elven-alliance-sim-loader.mjs --loader ./scripts/elven-strategy-ai-loader.mjs --loader ./scripts/elven-quest-autocomplete-loader.mjs --loader ./scripts/fortification-sim-loader.mjs --loader ./scripts/current-food-production-cleanup-loader.mjs ./scripts/run-external-relations-batch.mjs
      - name: External Relations active
        env:
          COST_MODE: proposed
          MERCHANT_AI: wealth
          EXTERNAL_RELATIONS: on
        run: node --loader ./scripts/development-cost-loader.mjs --loader ./scripts/external-relations-loader.mjs --loader ./scripts/elven-alliance-sim-loader.mjs --loader ./scripts/elven-strategy-ai-loader.mjs --loader ./scripts/elven-quest-autocomplete-loader.mjs --loader ./scripts/fortification-sim-loader.mjs --loader ./scripts/current-food-production-cleanup-loader.mjs ./scripts/run-external-relations-batch.mjs
      - name: Production Stake diagnostic baseline
        env:
          COST_MODE: proposed
          MERCHANT_AI: wealth
          EXTERNAL_RELATIONS: off
        run: node --loader ./scripts/development-cost-loader.mjs --loader ./scripts/external-relations-loader.mjs --loader ./scripts/elven-alliance-sim-loader.mjs --loader ./scripts/elven-strategy-ai-loader.mjs --loader ./scripts/elven-quest-autocomplete-loader.mjs --loader ./scripts/fortification-sim-loader.mjs --loader ./scripts/stake-ai-diagnostic-loader.mjs --loader ./scripts/current-food-production-cleanup-loader.mjs ./scripts/run-production-stake-diagnostic.mjs
      - name: Production Stake diagnostic with relations
        env:
          COST_MODE: proposed
          MERCHANT_AI: wealth
          EXTERNAL_RELATIONS: on
        run: node --loader ./scripts/development-cost-loader.mjs --loader ./scripts/external-relations-loader.mjs --loader ./scripts/elven-alliance-sim-loader.mjs --loader ./scripts/elven-strategy-ai-loader.mjs --loader ./scripts/elven-quest-autocomplete-loader.mjs --loader ./scripts/fortification-sim-loader.mjs --loader ./scripts/stake-ai-diagnostic-loader.mjs --loader ./scripts/current-food-production-cleanup-loader.mjs ./scripts/run-production-stake-diagnostic.mjs
      - name: Print A/B summaries
        run: |
          echo '--- baseline ---'
          node -e "console.log(JSON.stringify(require('./simulation-results/external-relations-baseline.json').summary, null, 2))"
          echo '--- relations ---'
          node -e "console.log(JSON.stringify(require('./simulation-results/external-relations-relations.json').summary, null, 2))"
          echo '--- stake diagnostic baseline ---'
          cat simulation-results/production-stake-diagnostic-baseline.json
          echo '--- stake diagnostic relations ---'
          cat simulation-results/production-stake-diagnostic-relations.json
      - uses: actions/upload-artifact@v4
        with:
          name: external-relations-ab-results
          path: |
            simulation-results/external-relations-*.json
            simulation-results/production-stake-diagnostic-*.json
