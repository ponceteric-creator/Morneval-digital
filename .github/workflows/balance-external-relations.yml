name: External Relations A/B simulation

on:
  push:
    paths:
      - '.github/workflows/balance-external-relations.yml'
      - 'js/v128-external-relations-engine.js'
      - 'scripts/external-relations-loader.mjs'
      - 'scripts/fortification-sim-loader.mjs'
      - 'scripts/run-external-relations-batch.mjs'
      - 'rules/Appendix_N_External_Relations_v01119_Simulation.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable ESM
        run: echo '{"type":"module"}' > package.json
      - name: Baseline without activated diplomacy
        env:
          COST_MODE: proposed
          MERCHANT_AI: wealth
          EXTERNAL_RELATIONS: off
        run: node --loader ./scripts/development-cost-loader.mjs --loader ./scripts/external-relations-loader.mjs --loader ./scripts/fortification-sim-loader.mjs ./scripts/run-external-relations-batch.mjs
      - name: External Relations active
        env:
          COST_MODE: proposed
          MERCHANT_AI: wealth
          EXTERNAL_RELATIONS: on
        run: node --loader ./scripts/development-cost-loader.mjs --loader ./scripts/external-relations-loader.mjs --loader ./scripts/fortification-sim-loader.mjs ./scripts/run-external-relations-batch.mjs
      - name: Print A/B summaries
        run: |
          echo '--- baseline ---'
          node -e "console.log(JSON.stringify(require('./simulation-results/external-relations-baseline.json').summary, null, 2))"
          echo '--- relations ---'
          node -e "console.log(JSON.stringify(require('./simulation-results/external-relations-relations.json').summary, null, 2))"
      - uses: actions/upload-artifact@v4
        with:
          name: external-relations-ab-results
          path: simulation-results/external-relations-*.json
