
name: Human Playtest UI

on:
  push:
    paths:
      - 'playtest.html'
      - 'playtest.css'
      - 'js/playtest-app.js'
      - 'js/v110-ai-engine.js'
      - 'js/v115-intrigue-sim-engine.js'
      - 'js/v119-political-influence-ai-engine.js'
      - 'js/v121-institution-tier-engine.js'
      - 'js/v122-institution-tier-full-engine.js'
      - 'js/v138-human-playtest-engine.js'
      - 'scripts/test-human-playtest-v138.mjs'
      - 'scripts/playtest-parity-snapshot.mjs'
      - 'scripts/build-playtest-browser.mjs'
      - '.github/workflows/human-playtest-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable ESM and install browser bundler
        run: |
          echo '{"type":"module"}' > package.json
          npm install --no-save esbuild
      - name: Browser client syntax
        run: node --check js/playtest-app.js && node --check js/v138-human-playtest-engine.js
      - name: Human playtest controller
        env:
          COST_MODE: proposed
          MERCHANT_AI: wealth
        run: >
          node
          --loader ./scripts/development-cost-loader.mjs
          --loader ./scripts/external-relations-loader.mjs
          --loader ./scripts/elven-alliance-sim-loader.mjs
          --loader ./scripts/elven-strategy-ai-loader.mjs
          --loader ./scripts/elven-quest-autocomplete-loader.mjs
          --loader ./scripts/fortification-sim-loader.mjs
          --loader ./scripts/production-stake-ai-v132-loader.mjs
          --loader ./scripts/investor-ai-v134-loader.mjs
          --loader ./scripts/current-food-production-cleanup-loader.mjs
          ./scripts/test-human-playtest-v138.mjs

      - name: Build Safari-equivalent bundle
        env:
          COST_MODE: proposed
          MERCHANT_AI: wealth
        run: node ./scripts/build-playtest-browser.mjs
      - name: Run bundled parity regression
        run: node ./dist/playtest-parity-test.mjs
      - name: Snapshot Node loader reference
        env:
          COST_MODE: proposed
          MERCHANT_AI: wealth
          PARITY_GAMES: 6
          PARITY_GENERATIONS: 5
        run: >
          node
          --loader ./scripts/development-cost-loader.mjs
          --loader ./scripts/external-relations-loader.mjs
          --loader ./scripts/elven-alliance-sim-loader.mjs
          --loader ./scripts/elven-strategy-ai-loader.mjs
          --loader ./scripts/elven-quest-autocomplete-loader.mjs
          --loader ./scripts/fortification-sim-loader.mjs
          --loader ./scripts/production-stake-ai-v132-loader.mjs
          --loader ./scripts/investor-ai-v134-loader.mjs
          --loader ./scripts/current-food-production-cleanup-loader.mjs
          ./scripts/playtest-parity-snapshot.mjs
          > ./dist/playtest-node-reference.json
      - name: Snapshot Safari-equivalent bundle
        env:
          PARITY_GAMES: 6
          PARITY_GENERATIONS: 5
        run: node ./dist/playtest-browser-snapshot.mjs > ./dist/playtest-browser-reference.json
      - name: Require exact Node/Safari parity
        run: cmp ./dist/playtest-node-reference.json ./dist/playtest-browser-reference.json
      - name: Check deployable files
        run: |
          test -s dist/playtest/index.html
          test -s dist/playtest/playtest-app.js
          test -s dist/playtest/playtest.css
          node --check dist/playtest/playtest-app.js
