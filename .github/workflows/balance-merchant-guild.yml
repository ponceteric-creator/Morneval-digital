name: Merchant Guild Wealth-score A/B simulation

on:
  push:
    paths:
      - '.github/workflows/balance-merchant-guild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable ESM
        run: echo '{"type":"module"}' > package.json
      - name: Legacy Merchant Guild scoring
        env:
          COST_MODE: proposed
          MERCHANT_MODE: legacy
          MERCHANT_AI: legacy
        run: node --loader ./scripts/development-cost-loader.mjs ./scripts/run-merchant-guild-score-batch.mjs
      - name: Wealth-score rule only
        env:
          COST_MODE: proposed
          MERCHANT_MODE: wealth
          MERCHANT_AI: off
        run: node --loader ./scripts/development-cost-loader.mjs ./scripts/run-merchant-guild-score-batch.mjs
      - name: Wealth-score with exact AI understanding
        env:
          COST_MODE: proposed
          MERCHANT_MODE: wealth
          MERCHANT_AI: wealth
        run: node --loader ./scripts/development-cost-loader.mjs ./scripts/run-merchant-guild-score-batch.mjs
      - name: Print summaries
        run: |
          echo '--- legacy ---'
          node -e "console.log(JSON.stringify(require('./simulation-results/merchant-guild-legacy.json').summary))"
          echo '--- wealth rule only ---'
          node -e "console.log(JSON.stringify(require('./simulation-results/merchant-guild-wealth-rule-only.json').summary))"
          echo '--- wealth + exact AI ---'
          node -e "console.log(JSON.stringify(require('./simulation-results/merchant-guild-wealth-ai-aware.json').summary))"
      - uses: actions/upload-artifact@v4
        with:
          name: merchant-guild-three-way-results
          path: simulation-results/merchant-guild-*.json
